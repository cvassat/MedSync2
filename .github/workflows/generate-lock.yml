name: Generate dependency locks

on:
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/generate-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Compile hashed locks on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lock compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.0

      - name: Compile runtime lock
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements.lock \
            requirements.txt

      - name: Compile development lock
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements-dev.lock \
            requirements-dev.txt

      - name: Verify hash-locked installation
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip check

      - name: Upload lock files
        uses: actions/upload-artifact@v4
        with:
          name: medsync2-hashed-locks-python-3.12
          path: |
            requirements.lock
            requirements-dev.lock
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated locks to same-repository hardening branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'comprehensive-code-hardening-2026-07-21'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock
          if git diff --cached --quiet; then
            echo "Lock files are already current."
            exit 0
          fi
          git commit -m "Add generated hashed dependency locks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
